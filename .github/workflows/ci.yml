name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Each check runs even if an earlier one failed, so one run shows every problem.
      - name: tests
        run: npm test

      - name: docs agree and links resolve
        if: ${{ !cancelled() }}
        run: npm run test:docs

      # The published package must work when installed, not just from a checkout.
      - name: installs and sets up a bare repo
        if: ${{ !cancelled() }}
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/project" && cd "$RUNNER_TEMP/project"
          git init -q
          npm init -y > /dev/null
          npm install -D "$RUNNER_TEMP"/uxagent-*.tgz
          npx uxagent init
          npx uxagent doctor
          npx uxagent sync --check
          npx uxagent setup --sync
